# Stages the package on npm (with provenance) when a version tag (v0.2.0,
# v0.3.0-beta.1…) is pushed, and drafts the GitHub release from the CHANGELOG
# section. Nothing is installable until a maintainer approves the staged
# version on npmjs.com (or `npm stage approve <id>`) with 2FA; then publish
# the draft release.
#
# Authentication: npm trusted publishing (OIDC, no token), configured on
# npmjs.com for this repo and workflow file with stage-only permissions, so
# a plain `npm publish` from here is rejected. See CLAUDE.md, "Releasing".
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the GitHub release
  id-token: write # trusted publishing and the provenance statement

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # No registry-url: it writes an .npmrc expecting NODE_AUTH_TOKEN, and
      # there is no token; npm gets one from GitHub's OIDC instead.
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # staging and trusted publishing need 22.14+
          cache: npm

      - name: The tag is package.json's version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

      - name: The CHANGELOG has this version
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"
            exit 1
          fi

      - run: npm ci
      - run: npm run check

      # `npm stage` needs npm 11.15.0 or later; Node 22 bundles npm 10.
      - run: npm install -g "npm@^11.15.0" && npm --version

      # The tag is fixed at staging time and can't be changed on approval.
      - name: Stage on npm
        run: |
          set -o pipefail
          tag=latest
          case "$GITHUB_REF_NAME" in *-*) tag=next ;; esac
          npm stage publish --provenance --access public --tag "$tag" 2>&1 | tee stage.log
          {
            echo "## ${GITHUB_REF_NAME} is staged on npm, not yet published"
            echo
            echo "Approve it with 2FA: npmjs.com → pricerules → Staged Packages → Approve,"
            echo "or \`npm stage list pricerules\` then \`npm stage approve <stage-id>\`."
            echo "Then publish the draft GitHub release."
            echo
            echo '```'
            cat stage.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes-file release-notes.md $prerelease
